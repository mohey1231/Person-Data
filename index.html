<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#465a65" />
    <meta
      name="description"
      content="Contact card for Abdullah Alsubaihi, Marketing Specialist at Thabat AlMaskan Real Estate Co."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23465a65'/%3E%3Cpath d='M18 46 31.5 15 46 46h-8l-2.6-6.5H27L24.5 46Zm11.6-13h3.3l-1.7-4.8Z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Contact Card</title>




    <body>
    <main class="card" aria-label="Abdullah Alsubaihi contact card">
      <header class="profile">
        <div class="avatar" role="img" aria-label="Portrait of Abdullah Alsubaihi">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8qh6bj65apXQ5cNMTGlRUO4JgHCyR0zNNitLecRMgYkfrvbxMuD_rVvQ&s=10" alt="" aria-hidden="true" />
        </div>
        <h1>
          <span class="arabic-name" lang="ar" dir="rtl"> الإسم</span>
        </h1>
        <p class="role">
          <span class="role-ar" lang="ar" dir="rtl"> الوظيفه</span>
        </p>
      </header>

      <!-- Phone -->


      <nav class="actions" aria-label="Quick contact actions">
        <a class="action" href="tel:+96612345678" aria-label="Call  ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.03-.24c1.12.37 2.33.57 3.56.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z" /></svg>
          <span>CALL</span>
        </a>


        <!-- Email -->

        <a class="action" href="mailto:name@domain.sa" aria-label="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 21 19-9L3 3v7l13 2-13 2z" /></svg>
          <span>EMAIL</span>
        </a>
      </nav>

      <section class="details" aria-label="Contact details">
        <div class="detail-row phone-group">
          <div class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.03-.24c1.12.37 2.33.57 3.56.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z" /></svg>
          </div>
          <div class="detail-content">
            <a class="value" href="tel:+96612345678">+96612345678</a>
            <span class="label">Mobile</span>
            <a class="value secondary-number" href="tel:96612345678">96612345678</a>
            <span class="label">Telephone</span>
          </div>
        </div>

        <div class="detail-row">
          <div class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5z" /></svg>
          </div>
          <div class="detail-content">
            <a class="value" href="mailto:name@domain.sa">name@domain.sa</a>
            <span class="label">Email</span>
          </div>
        </div>

        <div class="detail-row company">
          <div class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Zm-6 0h-4V4h4z" /></svg>
          </div>
          <div class="detail-content">
            <span class="value">الشركة التي يعمل بها</span>
          </div>
        </div>

        <div class="detail-row location">
          <div class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z" /></svg>
          </div>
          <a class="detail-content" href="https://www.google.com/maps/search/?api=1&amp;query=Riyadh%2C%20Saudi%20Arabia" target="_blank" rel="noreferrer">
            <span class="value">Riyadh</span>
            <span class="value">Saudi Arabia</span>
          </a>
        </div>
      </section>
    </main>
  </body>





    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Segoe UI", Tahoma, sans-serif;
        background: #e9ecee;
        color: #25282a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #e9ecee;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .card {
        width: 100%;
        min-height: 100vh;
        margin: 0 auto;
        overflow: hidden;
        background: #f7f7f7;
      }

      .profile {
        height: 231px;
        padding-top: 50px;
        color: white;
        text-align: center;
        background: #465a65;
      }

      .avatar {
        position: relative;
        width: 81px;
        height: 81px;
        margin: 0 auto 15px;
        overflow: hidden;
        border-radius: 50%;
        background: white;
      }

      .avatar img {
        position: absolute;
        top: 5px;
        left: -2px;
        width: 84px;

      }

      h1 {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 5px;
        margin: 0;
        font-size: 19px;
        font-weight: 400;
        line-height: 1.3;
        white-space: nowrap;
      }

      .slash {
        color: rgba(255, 255, 255, 0.88);
      }

      .arabic-name {
        font-size: 18px;
      }

      .role {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 11px;
        line-height: 1.25;
      }

      .role-ar {
        font-size: 12px;
      }

      .role-sub {
        display: block;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.65);
        font-size: 10px;
        line-height: 1;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 50px;
        color: white;
        background: #465a65;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
      }

      .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        transition: background-color 160ms ease;
      }

      .action:last-child {
        border-right: 0;
      }

      .action:hover,
      .action:focus-visible {
        background: rgba(255, 255, 255, 0.09);
        outline: none;
      }

      .action svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      .action span {
        font-size: 9px;
        line-height: 1;
      }

      .details {
        padding: 25px 0 21px;
        background: #f7f7f7;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        min-height: 66px;
      }

      .detail-row.phone-group {
        min-height: 121px;
      }

      .detail-row.location {
        min-height: 78px;
      }

      .detail-icon {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10px;
        color: #b4b5bc;
      }

      .detail-row:not(.phone-group) .detail-icon {
        padding-top: 20px;
      }

      .detail-icon svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      .detail-content {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: flex-start;
        padding: 9px 20px 14px 0;
        border-bottom: 1px solid #e9e9e9;
      }

      .detail-row:not(.phone-group) .detail-content {
        padding-top: 19px;
        padding-bottom: 4px;
      }

      .detail-row:last-child .detail-content {
        border-bottom: 0;
      }

      .value {
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.35;
      }

      .label {
        margin-top: 2px;
        color: #8f9297;
        font-size: 11px;
        line-height: 1.3;
      }

      .secondary-number {
        margin-top: 31px;
      }

      .company .value {
        font-size: 12px;
      }

      .company .label {
        white-space: normal;
      }

      @media (min-width: 640px) {
        body {
          display: grid;
          min-height: 100vh;
          place-items: center;
          padding: 32px;
        }

        .card {
          width: min(100%, 560px);
          min-height: 658px;
          border-radius: 14px;
          box-shadow: 0 20px 55px rgba(42, 55, 61, 0.2);
        }

        .detail-row {
          grid-template-columns: 92px minmax(0, 1fr);
        }

        .detail-content {
          padding-right: 46px;
        }
      }

      @media (max-width: 360px) {
        h1 {
          gap: 3px;
          font-size: 17px;
        }

        .arabic-name {
          font-size: 16px;
        }

        .detail-row {
          grid-template-columns: 60px minmax(0, 1fr);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .action {
          transition: none;
        }
      }
    </style>
  </head>
  
</html>
